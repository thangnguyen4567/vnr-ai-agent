        description: ID nhân viên
        input_method: query
        type: string
        default: 2cee3a43-38ff-4847-bc7a-983e12e41cf8
        required: true
      - name: DateStart
        description: Ngày bắt đầu xin nghỉ (yyyy/MM/dd)
        input_method: query
        type: string
        default: 2025/08/04
        required: true
      - name: LeavedayTypeID
        description: ID loại ngày nghỉ
        input_method: query
        type: string
        default: 40e0b514-3558-45a2-b579-8f0821621909
        required: true
      method: POST
      full_url: http://localhost:8000/https://ba.vnresource.net:1013/api/Att_LeaveDay/GetRemainAnlDays
