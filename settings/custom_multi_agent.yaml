agent_id: 5e02b315-c808-450c-8205-de88e30edae1
name: Multi Agent
type: multi
sub_agents:
- agent_id: c9e381c7-4115-4f8a-a733-43be10a72768m
  name: Attendance Agent
  description: Agent tìm kiếm thông tin về lịch làm việc, tăng ca, đăng ký nghỉ ,
    ds ngày nghỉ của nhân viên hoặc các dữ liệu liên quan đến công của nhân viên
  type: fc
  nodes:
    llm:
      provider: openai
      agent_prompt: ''
    tools:
    - type: store
      name: get_leaveday
      description: Xem số ngày nghỉ còn lại của một nhân viên
      tool_path: api/Att_LeaveDay/GetRemainAnlDays
      input_params:
      - name: ProfileID
        description: ID nhân viên
        input_method: query
        type: string
        default: ''
        required: true
      - name: DateStart
        description: Ngày bắt đầu xin nghỉ (yyyy/MM/dd)
        input_method: query
        type: string
        default: 2025/08/04
        required: true
      - name: LeavedayTypeID
        description: ID loại ngày nghỉ
        input_method: query
        type: string
        default: 1b360462-ede9-45b4-a940-ab916efc83b3
        required: true
      method: POST
      store_name: ''
      rec_take: '5'
    - type: built_in
      name: register_leaveday
      description: Thực hiện đăng ký nghỉ phép
    - type: http
      name: list_leaveday
      description: Danh sách ngày nghỉ đã được đăng ký
      tool_path: api/Att_LeaveDay/New_GetPersonalLeaveDayHandle
      input_params:
      - name: DateStart
        description: 'Được đăng ký từ ngày '
        input_method: query
        type: string
        default: ''
        required: false
      - name: DateEnd
        description: Được đăng ký đến ngày
        input_method: query
        type: string
        default: ''
        required: false
      - name: ProfileID
        description: ID nhân viên cần tìm
        input_method: query
        type: string
        default: ''
        required: false
      - name: ValueFields
        description: Các field dữ liệu cần lấy
        input_method: query
        type: string
        default: ID,ProfileName,DateStart,LeaveDays,StatusView
        required: false
      - name: dataSourceRequestString
        description: Số record cần lấy
        input_method: query
        type: string
        default: page=1&pageSize=5
        required: false
      method: POST
    - type: http
      name: approve_leaveday
      description: Duyệt ngày nghỉ
      tool_path: api/Att_LeaveDay/SetApproveLeaveDayInPortal
      input_params:
      - name: ListRecordID
        description: Danh sách ID yêu cầu nghỉ phép
        input_method: query
        type: array
        default: ''
        required: false
      - name: UserProcessID
        description: ID người thực hiện phê duyệt
        input_method: query
        type: string
        default: a20128a7-cd70-4fc3-9050-56d4befff410
        required: false
      - name: Comment
        description: Lý do duyệt hoặc ý kiến bổ sung thêm
        input_method: query
        type: string
        default: ''
        required: false
      method: POST
    - type: http
      name: reject_leaveday
      description: Từ chối duyệt ngày nghỉ
      tool_path: api/Att_LeaveDay/SetRejectLeaveDayInPortal
      input_params:
      - name: ListRecordID
        description: Danh sách ID yêu cầu nghỉ phép
        input_method: query
        type: array
        default: ''
        required: false
      - name: UserProcessID
        description: ID người thực hiện phê duyệt
        input_method: query
        type: string
        default: a20128a7-cd70-4fc3-9050-56d4befff410
        required: false
      - name: Comment
        description: Lý do từ chối
        input_method: query
        type: string
        default: ''
        required: false
      method: POST
    - type: http
      name: approve_overtime
      description: Phê duyệt tăng ca
      tool_path: api/Att_OvertimePlan/SetApproveOvertimePlanInPortal
      input_params:
      - name: ListRecordID
        description: Danh sách ID yêu cầu tăng ca
        input_method: query
        type: array
        default: ''
        required: false
      - name: UserProcessID
        description: ID người phê duyệt tăng ca
        input_method: query
        type: string
        default: a20128a7-cd70-4fc3-9050-56d4befff410
        required: false
      - name: Comment
        description: Lý do duyệt hoặc yêu cầu bổ sung
        input_method: query
        type: string
        default: ''
        required: false
      method: POST
    - type: http
      name: reject_overtime
      description: Từ chối tăng cả
      tool_path: api/Att_OvertimePlan/SetRejectOvertimePlanInPortal
      input_params:
      - name: ListRecordID
        description: Danh sách ID yêu cầu tăng ca
        input_method: query
        type: array
        default: ''
        required: false
      - name: UserProcessID
        description: ID người từ chối yêu cầu
        input_method: query
        type: string
        default: a20128a7-cd70-4fc3-9050-56d4befff410
        required: false
      - name: Comment
        description: Lý do từ chối yêu cầu
        input_method: query
        type: string
        default: ''
        required: false
      method: POST
    - type: built_in
      name: register_overtime
      description: Thực hiện đăng ký tăng ca
    - type: http
      name: list_overtime
      description: Danh sách yêu cầu đăng ký tăng ca
      tool_path: api/Att_OvertimePlan/New_PlanOvertimeByFilterHandle
      input_params:
      - name: DateStart
        description: Ngày bắt đầu đăng ký
        input_method: query
        type: string
        default: ''
        required: false
      - name: DateEnd
        description: Ngày kết thúc đăng ký
        input_method: query
        type: string
        default: ''
        required: false
      - name: ValueFields
        description: Các field dữ liệu cần lấy
        input_method: query
        type: string
        default: ID,ProfileName,WorkDate,RegisterHours,UdHourByDate,StatusView
        required: false
      - name: dataSourceRequestString
        description: số record cần lấy
        input_method: query
        type: string
        default: page=1&pageSize=5
        required: false
      method: POST
