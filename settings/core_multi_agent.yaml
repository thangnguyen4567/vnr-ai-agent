  name: Goal Agent
  description: Agent tìm kiếm thông tin về mục tiêu KPI của công ty, nhân viên, bộ
    phận
  type: fc
  nodes:
    llm:
      provider: openai
      agent_prompt: ''
    tools:
    - type: store
      name: get_goal
      description: Lấy ds mục tiêu của bộ phận
      tool_path: ''
