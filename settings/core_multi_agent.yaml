        input_method: query
        type: string
        default: ''
        required: false
      method: GET
      store_name: sp_eva_get_goal_department
    - type: http
      name: get_leaveday
      description: Xem số ngày nghỉ còn lại của một nhân viên
      tool_path: /api/Att_LeaveDay/GetRemainAnlDays
      input_params:
      - name: ProfileID
        description: ID nhân viên
        input_method: query
        type: string
        default: 54c12a16-a53e-4246-8c7b-7b409c8b2c35
        required: true
      - name: DateStart
        description: Ngày bắt đầu xin nghỉ (yyyy/MM/dd)
        input_method: query
        type: string
        default: 2025/08/04
        required: true
      - name: LeavedayTypeID
        description: ID loại ngày nghỉ
        input_method: query
        type: string
        default: 1b360462-ede9-45b4-a940-ab916efc83b3
        required: true
      method: POST
