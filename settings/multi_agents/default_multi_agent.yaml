      tool_path: sp_eva_get_progress_overview
      input_params: []
      method: GET
      store_name: sp_eva_get_progress_overview
      tool_type: dynamic
    - type: workflow
      name: register_goal
      description: Thực hiện giao mục tiêu cho phòng ban bộ phận hoặc cá nhân, mục
        tiêu theo năm hoặc quý ( từ đầu năm đến cuối năm hoặc từ đầu quý đến cuối
        quý)
      input_params:
      - name: type
        description: loại mục tiêu có thể là 1 trong KPI, OKR , SMART
        input_method: query
        type: string
        default: KPI
        required: true
      - name: goal_name
        description: Tên mục tiêu
        input_method: query
        type: string
        default: ''
        required: true
      - name: target
        description: Target cần đạt của mục tiêu
        input_method: query
        type: number
        default: ''
        required: true
      - name: weight
        description: Trọng số mục tiêu
        input_method: query
        type: number
        default: '100'
        required: true
      - name: start_date
        description: 'Ngày bắt đầu '
        input_method: query
        type: string
        default: ''
        required: true
      - name: end_date
        description: Ngày kết thúc
        input_method: query
        type: string
        default: ''
        required: true
      - name: department_name
        description: Tên phòng ban
        input_method: query
        type: string
        default: ''
        required: false
      - name: employee_name
        description: Tên nhân viên
        input_method: query
        type: string
        default: ''
        required: false
      - name: scope
        description: Phạm vi giao mục tiêu Literal['Organization', 'Individual']
        input_method: query
        type: string
        default: Organization
        required: true
      - name: measurement_unit
        description: Đơn vị đo lường mục tiêu Literal['Ngày', 'Giờ', 'VNĐ', 'Phần
          trăm']
        input_method: query
        type: string
        default: VNĐ
        required: true
      token_workflow: app-b2ighC95ZCTmUPRQLgmEDbfb
    - type: workflow
      name: confirm_goal
      description: Thực hiện xác nhận hoặc từ chối mục tiêu
      tool_path: ''
      input_params:
      - name: status
        description: Trạng thái thực hiện E_CONFIRMED hoặc E_REJECTED
        input_method: query
        type: string
        default: E_CONFIRMED
        required: true
      - name: goal_name
        description: Tên mục tiêu cần thực hiện
        input_method: query
        type: string
        default: ''
        required: true
      method: GET
      token_workflow: app-pv80IrswgvRJShlPU6aL1Bt1
